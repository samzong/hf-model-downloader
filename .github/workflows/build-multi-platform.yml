name: Build Multi-Platform

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag (e.g., v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    runs-on: macos-latest # ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Run smoke tests
        run: make test

      - name: Build DMG (ARM64)
        run: |
          echo "Building for ARM64 architecture..."
          make clean build dmg
          echo "Build completed, checking output:"
          ls -la dist/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            dist/hf-model-downloader-arm64.dmg \
            --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Setup make for Windows
        run: |
          choco install make
        
      - name: Install dependencies
        run: make install

      - name: Run smoke tests
        run: make test

      - name: Build Windows Executable
        run: |
          echo "Building for Windows..."
          make clean build
          echo "Build completed, checking output:"
          dir dist\

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            hf-model-downloader-windows-x86_64.zip \
            --clobber

  publish-release:
    needs: [build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in hf-model-downloader-arm64.dmg hf-model-downloader-windows-x86_64.zip; do
            if ! grep -qx "$asset" <<< "$assets"; then
              echo "Missing release asset: $asset"
              exit 1
            fi
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  notify-homebrew-tap:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tap package update
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/samzong/homebrew-tap/dispatches \
            -f event_type=homebrew-package-release \
            -f "client_payload[package]=hf-model-downloader" \
            -f "client_payload[version]=${{ inputs.release_tag }}"
