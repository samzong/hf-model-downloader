name: Semantic Release

permissions:
  contents: write

on:
  push:
    branches: [main, alpha, beta, rc]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'
      
      - name: Verify SemVer mapping and PEP 440 pyproject.toml version
        run: uv run --no-project python scripts/check-release-tag.py

      - name: Install dependencies
        run: make install
      
      - name: Configure Git
        run: |
          echo "Configuring Git for automated commits"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Git configuration completed"
      
      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          BEFORE_SHA=$(git rev-parse HEAD)
          NEXT_TAG=$(uv run semantic-release version --print-tag)
          uv run semantic-release version --no-vcs-release

          if [ "$BEFORE_SHA" != "$(git rev-parse HEAD)" ]; then
            uv run --no-project python scripts/check-release-tag.py "$NEXT_TAG" --check-ref
            args=(--draft --verify-tag)
            if [[ "$NEXT_TAG" == *-* ]]; then
              args+=(--prerelease --latest=false)
            fi
            awk '/^## v/{n++} n==1' CHANGELOG.md > release-notes.md
            test -s release-notes.md
            gh release create "$NEXT_TAG" \
              "${args[@]}" \
              --title "$NEXT_TAG" \
              --notes-file release-notes.md
            {
              echo "released=true"
              echo "tag=$NEXT_TAG"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  trigger-build:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Multi-Platform Build
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh workflow run build-multi-platform.yml \
            --repo samzong/hf-model-downloader \
            --ref "$RELEASE_TAG" \
            --field release_tag="$RELEASE_TAG"
